# ==============================================================================
# KONFIGURASI SISTEM NOMOR ANTRIAN CREATIVE AND MARKETING PU
# ==============================================================================
# File ini digunakan oleh:
# - Operator Antrian.exe
# - Kios Tiket.exe
# - Layar TV.exe
# - Pusat Kontrol.exe
#
# Untuk komputer Klien (di luar PC Induk Server):
# Ganti Host = localhost dengan Alamat IP PC Utama (contoh: Host = 192.168.1.50)
# ==============================================================================

[Server]
# Host server (localhost untuk PC Induk, atau alamat IP jika di PC/Tablet lain)
Host = localhost

# Port server antrian (default: 3000)
Port = 3000

[Operator]
# Pilihan default meja operator (contoh: 1, 2, 3, atau kosongkan untuk pilih manual)
DefaultDesk = 

[Window]
# Mode jendela:
# app     = Jendela mandiri (seperti aplikasi desktop tanpa tab/address bar browser)
# browser = Buka di tab browser default
# kiosk   = Layar penuh mutlak (cocok untuk monitor kios tablet)
Mode = app

# Apakah jendela otomatis dimaksimalkan saat pertama kali dibuka? (true / false)
StartMaximized = true

# Khusus Layar TV: paksa fullscreen tanpa bingkai jendela? (true / false)
TvFullscreen = false

# Khusus Kios Tiket: paksa fullscreen sentuh? (true / false)
KioskFullscreen = false

# Dimensi jendela awal jika StartMaximized = false
Width = 1280
Height = 800
